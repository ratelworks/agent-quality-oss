# npm 게시 자동화 — tag(vX.Y.Z)를 올리면 registry 에 게시한다
#
# 게시 인증을 개인 컴퓨터의 토큰에서 떼어낸다. tag 만 올리면 게시가 끝나고,
# 게시되는 코드는 항상 tag 시점의 트리와 같다.
#
# 인증은 두 경로를 지원한다. npm CLI 가 OIDC 를 먼저 찾고 없으면 토큰을 쓴다.
#
#   [권장] Trusted Publishing (OIDC) — 토큰 없음, 만료 없음
#     npmjs.com → 패키지 페이지 → Settings → "Trusted Publisher" 에 등록:
#       Organization or user : ratelworks
#       Repository           : agent-quality-oss
#       Workflow filename    : npm-publish.yml      (경로가 아니라 파일 이름만)
#     ⚠️ npm CLI 11.5.1 이상이 필요하다 — 아래 "npm CLI 상향" 단계가 있어야 OIDC 가 동작한다.
#
#   [대체] NPM_TOKEN Secret — 토큰 발급·교체가 필요하다
#
# 게이트: npm publish 가 package.json 의 prepublishOnly(공개 위생·형식 검사·릴리스 노트·빌드·
#         전체 시험·문서 수치·양식 근거)를 자동으로 돌린다. 하나라도 실패하면 게시되지 않는다.
name: npm publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: # 게이트 실패 뒤 다시 돌릴 때

permissions:
  contents: read
  id-token: write # Trusted Publishing(OIDC) 인증에 필요

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Node 22 에 든 npm 은 10.9.x 인데 Trusted Publishing 은 11.5.1 이상을 요구한다.
      # `npm@latest` 로 두지 않는다 — 확인하지 않은 새 메이저가 바로 들어온다.
      - name: npm CLI 상향 (OIDC 요구사항 — 11.5.1+, 메이저 고정)
        run: npm install -g "npm@^11.5.1"

      - name: Install
        run: npm ci

      - name: Tag ↔ package.json 버전 일치 확인
        id: version
        run: |
          PKG_VER="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
          else
            TAG_VER="$PKG_VER"
          fi
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::tag v$TAG_VER ≠ package.json $PKG_VER — 버전이 서로 다릅니다"
            exit 1
          fi
          echo "version=$PKG_VER" >> "$GITHUB_OUTPUT"

      - name: 이미 게시된 버전인지 확인 (다시 돌려도 안전)
        id: published
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "이미 게시됨 — 게시 단계를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (prepublishOnly 게이트 자동 실행)
        if: steps.published.outputs.skip == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
